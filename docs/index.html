<!doctype html>
<html lang="sv">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
	<meta name="theme-color" content="#101827">
	<title>Gravity Run</title>
	<style>
		html, body {
			width: 100%;
		height: 100%;
			margin: 0;
			overflow: hidden;
			background: #101827;
		}
		body {
			display: grid;
			place-items: center;
		}
		#game-shell {
			width: min(100vw, 177.7778vh, 1920px);
			height: min(56.25vw, 100vh, 1080px);
			width: min(100vw, 177.7778dvh, 1920px);
			height: min(56.25vw, 100dvh, 1080px);
			aspect-ratio: 16 / 9;
			overflow: hidden;
			background: #101827;
		}
		#game-frame {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
			background: #101827;
		}
		#rotate-message {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 2;
			align-items: center;
			justify-content: center;
			padding: 2rem;
			box-sizing: border-box;
			text-align: center;
			font: 600 1.25rem system-ui, sans-serif;
			color: #edf3ff;
			background: #101827;
		}
		@media (orientation: portrait) {
			#rotate-message { display: flex; }
		}
	</style>
</head>
<body>
	<main id="game-shell">
		<iframe id="game-frame" src="game/index.html" title="Gravity Run" allow="fullscreen; autoplay" allowfullscreen></iframe>
	</main>
	<div id="rotate-message" role="status">VÄND MOBILEN TILL LIGGANDE LÄGE</div>
	<script>
	if ('serviceWorker' in navigator) {
		const migrationKey = 'gravity-run-pages-shell-v1';
		navigator.serviceWorker.addEventListener('controllerchange', () => {
			if (sessionStorage.getItem(migrationKey)) return;
			sessionStorage.setItem(migrationKey, '1');
			location.reload();
		}, { once: true });
		navigator.serviceWorker.register('./index.service.worker.js', { scope: './' }).catch(() => {});
	}
	</script>
</body>
</html>
