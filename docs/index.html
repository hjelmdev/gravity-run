<!doctype html>
<html lang="sv">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
	<meta name="theme-color" content="#101827">
	<title>Gravity Run</title>
	<style>
		html, body {
			width: 100%;
		height: 100%;
			margin: 0;
			overflow: hidden;
			background: #101827;
		}
		body {
			display: grid;
			place-items: center;
		}
		#game-shell {
			width: min(100vw, 177.7778vh, 1920px);
			height: min(56.25vw, 100vh, 1080px);
			width: min(100vw, 177.7778dvh, 1920px);
			height: min(56.25vw, 100dvh, 1080px);
			aspect-ratio: 16 / 9;
			overflow: hidden;
			background: #101827;
		}
		/* Touch-first devices use the whole available display instead of a 16:9 letterbox. */
		@media (pointer: coarse) {
			#game-shell {
				width: 100vw;
				height: 100vh;
				width: 100dvw;
				height: 100dvh;
				max-width: none;
				max-height: none;
				aspect-ratio: auto;
			}
		}
		/* Keep the game rendered in landscape even if the device is held upright. */
		html.phone-portrait #game-shell {
			position: fixed;
			left: 50%;
			top: 50%;
			width: 100vh;
			height: 100vw;
			width: 100dvh;
			height: 100dvw;
			transform: translate(-50%, -50%) rotate(90deg);
		}
		#rotate-prompt {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 10;
			box-sizing: border-box;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			gap: 20px;
			padding: max(24px, env(safe-area-inset-top)) 28px max(24px, env(safe-area-inset-bottom));
			text-align: center;
			color: #edf3ff;
			background: #101827;
			font-family: Arial, sans-serif;
		}
		#rotate-prompt .rotate-icon {
			width: 72px;
			height: 72px;
			border: 3px solid #42d6c5;
			border-radius: 18px;
			position: relative;
		}
		#rotate-prompt .rotate-icon::before {
			content: "";
			position: absolute;
			width: 28px;
			height: 48px;
			left: 19px;
			top: 9px;
			border: 3px solid #edf3ff;
			border-radius: 5px;
		}
		#rotate-prompt strong {
			font-size: clamp(22px, 6vw, 30px);
			letter-spacing: 0.04em;
		}
		#rotate-prompt span {
			max-width: 320px;
			font-size: 16px;
			line-height: 1.5;
			color: #b9c8dc;
		}
		html.phone-portrait #rotate-prompt {
			display: flex;
		}
		#game-frame {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
			background: #101827;
		}
	</style>
</head>
<body>
	<main id="game-shell">
		<iframe id="game-frame" src="game/index.html" title="Gravity Run" allow="fullscreen; autoplay" allowfullscreen></iframe>
	</main>
	<aside id="rotate-prompt" role="status" aria-live="polite">
		<div class="rotate-icon" aria-hidden="true"></div>
		<strong>VÄND SKÄRMEN</strong>
		<span>Gravity Run spelas i liggande läge. Vänd mobilen för att fortsätta.</span>
	</aside>
	<script>
	(() => {
		const phone = /iPhone|iPod|Android.*Mobile/i.test(navigator.userAgent);
		const portrait = window.matchMedia('(orientation: portrait)');
		const updateOrientationPrompt = () => {
			document.documentElement.classList.toggle('phone-portrait', phone && portrait.matches);
		};
		updateOrientationPrompt();
		portrait.addEventListener?.('change', updateOrientationPrompt);
	})();
	if ('serviceWorker' in navigator) {
		const migrationKey = 'gravity-run-pages-shell-v1';
		navigator.serviceWorker.addEventListener('controllerchange', () => {
			if (sessionStorage.getItem(migrationKey)) return;
			sessionStorage.setItem(migrationKey, '1');
			location.reload();
		}, { once: true });
		navigator.serviceWorker.register('./index.service.worker.js', { scope: './' }).catch(() => {});
	}
	</script>
</body>
</html>
