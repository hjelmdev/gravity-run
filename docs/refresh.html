<!doctype html>
<html lang="sv">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Uppdaterar Gravity Run</title>
	<style>
		html, body { min-height: 100%; margin: 0; background: #101827; color: #edf3ff; font: 18px Arial, sans-serif; }
		body { display: grid; place-items: center; text-align: center; }
		p { padding: 24px; }
	</style>
</head>
<body>
	<p>Uppdaterar Gravity Run…</p>
	<script>
	(async () => {
		const appScope = new URL('./', location.href).href;
		const cachePrefix = 'Gravity Run-sw-cache-';
		if ('serviceWorker' in navigator) {
			const registrations = await navigator.serviceWorker.getRegistrations();
			await Promise.all(registrations
				.filter((registration) => registration.scope.startsWith(appScope))
				.map((registration) => registration.unregister()));
		}
		if ('caches' in window) {
			const names = await caches.keys();
			await Promise.all(names.filter((name) => name.startsWith(cachePrefix)).map((name) => caches.delete(name)));
		}
		location.replace('./');
	})().catch(() => location.replace('./'));
	</script>
</body>
</html>
